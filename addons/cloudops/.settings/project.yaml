apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudops
  namespace: argocd
spec:
  description: Projeto GitOps principal para addons de infraestrutura
  sourceRepos:
    - '*'
  sourceNamespaces:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
