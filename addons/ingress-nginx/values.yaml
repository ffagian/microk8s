ingress-nginx:
  controller:
    service:
      type: LoadBalancer
      # Esta anotação é o que o MetalLB realmente ouve hoje em dia:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.56.201
      # Você pode manter o campo abaixo por compatibilidade, mas a annotation manda:
      loadBalancerIP: 192.168.56.201
      externalTrafficPolicy: Local