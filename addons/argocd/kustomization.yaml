apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

labels:
  - pairs:
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/part-of: argocd

resources:
  - ingress.yaml

helmCharts:
  - name: argo-cd
    releaseName: argocd
    version: 6.7.11
    repo: https://argoproj.github.io/argo-helm
    valuesFile: values.yaml