apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
  # NÃO coloque o argocd-cm.yaml aqui!

helmCharts:
  - name: argo-cd
    releaseName: argocd
    version: 6.7.11
    repo: https://argoproj.github.io/argo-helm
    valuesFile: values.yaml

# USE ISSO PARA MODIFICAR O CONFIGMAP DO HELM:
patches:
  - path: argocd-cm.yaml