# =====================================================
# Argo CD - HA para 2 nodes
# 1 pod por node (obrigatório)
# =====================================================

global:
  additionalLabels:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd

# -----------------------------------------------------
# ArgoCD Server
# -----------------------------------------------------

server:
  replicas: 2

  service:
    type: ClusterIP

  extraArgs:
    - --insecure
    - --staticassets
    - --server-base-href=/

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - argocd-server
          topologyKey: kubernetes.io/hostname

# -----------------------------------------------------
# Repo Server
# -----------------------------------------------------

repoServer:
  replicas: 2

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - argocd-repo-server
          topologyKey: kubernetes.io/hostname

# -----------------------------------------------------
# Application Controller
# -----------------------------------------------------

controller:
  replicas: 2

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - argocd-application-controller
          topologyKey: kubernetes.io/hostname

# -----------------------------------------------------
# Redis (single)
# -----------------------------------------------------

redis:
  enabled: true

redis-ha:
  enabled: false

# -----------------------------------------------------
# Configurações internas
# -----------------------------------------------------

configs:
  params:
    server.insecure: true
