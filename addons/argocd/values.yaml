argo-cd:
  global:
    # Isso garante que os pods tentem se espalhar entre os hosts
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: DoNotSchedule # Força a espalhar (1 em cada nó)

  server:
    replicas: 2
    # Mantemos como ClusterIP (padrão) pois usaremos o Ingress.yaml para expor
    service:
      type: ClusterIP 
    extraArgs:
      - --ssl-passthrough # Necessário para o Ingress Nginx não quebrar o HTTPS

  repoServer:
    replicas: 2

  controller:
    replicas: 1 # IMPORTANTE: O controller não suporta HA nativo sem Sharding complexo.
                # Se o nó do controller cair, o Kubernetes sobe ele no outro nó em segundos.

  dex:
    replicas: 2

  redis:
    # Em 2 nós, não use Redis-HA (que exige 3 nodes para quorum).
    # O Redis simples com persistência é mais seguro aqui.
    enabled: true