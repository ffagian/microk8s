argo-cd:
  global:
    # Resolve o problema do Service não achar os Pods
    additionalLabels:
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/part-of: argocd
    
    topologySpreadConstraints: &commonConstraints
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: argocd

  server:
    replicas: 2
    topologySpreadConstraints: *commonConstraints
    service:
      type: ClusterIP # O Ingress fará o papel de porta de entrada

  repoServer:
    replicas: 2
    topologySpreadConstraints: *commonConstraints

  controller:
    replicas: 2

  redis-ha:
    enabled: true