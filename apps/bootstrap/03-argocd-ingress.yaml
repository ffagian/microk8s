apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"   # Depois do Nginx estar pronto
spec:
  project: default
  source:
    repoURL: 'https://github.com/ffagian/microk8s.git'
    targetRevision: main
    path: apps/bootstrap/argocd-ingress   # Aponta para o manifest do Ingress
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
