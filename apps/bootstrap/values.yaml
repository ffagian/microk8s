# =====================================================
# Argo CD - values.yaml (2 Nodes, 1 Pod por Nó)
# =====================================================

# Constraints comuns: espalha 1 pod por nó
commonConstraints: &commonConstraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchExpressions:
          - key: app.kubernetes.io/part-of
            operator: In
            values:
              - argocd

# Estratégia conservadora (evita churn)
commonStrategy: &commonStrategy
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# -------------------------
# ArgoCD Core Components
# -------------------------

server:
  replicas: 2
  topologySpreadConstraints: *commonConstraints
  strategy: *commonStrategy
  service:
    type: ClusterIP

repoServer:
  replicas: 2
  topologySpreadConstraints: *commonConstraints
  strategy: *commonStrategy

controller:
  replicas: 2
  topologySpreadConstraints: *commonConstraints

dex:
  replicas: 2
  topologySpreadConstraints: *commonConstraints

# -------------------------
# Redis (Single - recomendado para 2 nodes)
# -------------------------

redis-ha:
  enabled: false
