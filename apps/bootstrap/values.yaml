# =====================================================
# Argo CD - values.yaml (Restrito: 1 Pod por Nó, Sem Reagendamento)
# =====================================================

# Configuração para travar o Pod no nó e não deixar migrar/acumular
commonConstraints: &commonConstraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      # DoNotSchedule: Se não houver nó livre, NÃO cria o pod (evita Pending)
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchExpressions:
          - key: app.kubernetes.io/part-of
            operator: In
            values:
              - argocd

# Estratégia para não tentar recriar pods em outros nós se um cair
commonStrategy: &commonStrategy
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

server:
  replicas: 3
  topologySpreadConstraints: *commonConstraints
  strategy: *commonStrategy

repoServer:
  replicas: 3
  topologySpreadConstraints: *commonConstraints
  strategy: *commonStrategy

controller:
  replicas: 3
  # O controller é um StatefulSet, o espalhamento é nativo por réplica/nó
  topologySpreadConstraints: *commonConstraints

dex:
  replicas: 3
  topologySpreadConstraints: *commonConstraints

redis-ha:
  enabled: true
  haproxy:
    replicas: 3
  redis:
    replicas: 3