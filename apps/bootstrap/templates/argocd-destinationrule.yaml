apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: argocd-server-tls-disable
  namespace: argocd
spec:
  host: argocd-server.argocd.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE # O Istio vai iniciar a conversa em TLS com o ArgoCD
      sni: argocd-server.argocd.svc.cluster.local