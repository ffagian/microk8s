apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
      - name: argocd-server
        args:
        - --staticassets
        - --server-base-href
        - /
        - --repo-server
        - argocd-repo-server:8081
        - --redis
        - argocd-redis:6379