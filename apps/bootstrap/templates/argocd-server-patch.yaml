apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
      - name: argocd-server
        command:
        - argocd-server
        - --insecure
        - --staticassets
        - /shared/app
        # ESSAS DUAS LINHAS RESOLVEM O ERRO 401:
        - --allowed-hosts
        - "argocd-app-of-apps.lab.local,192.168.56.200"