apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
      - name: argocd-server
        args:
        - --staticassets
        # NOTA: Omitimos o --insecure para que o servidor use o certificado auto-assinado interno na 443.