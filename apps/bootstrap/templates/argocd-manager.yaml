apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:ffagian/microk8s.git
    targetRevision: main
    path: apps/bootstrap
    helm:
      valueFiles:
        - values.yaml    # Ele vai ler as configurações de HA que você definiu
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true