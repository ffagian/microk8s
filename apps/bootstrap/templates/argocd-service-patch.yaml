apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Ensure this resource is applied and will override the Service type if it already exists.
    kubectl.kubernetes.io/restartedAt: "{{ now | unixepoch }}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
