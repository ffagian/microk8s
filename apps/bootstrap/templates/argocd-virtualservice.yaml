apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: cluster-routing
  namespace: argocd
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/ingress-gateway-config
  http:
  - match:
    - uri:
        prefix: /kiali
    route:
    - destination:
        host: kiali.istio-system.svc.cluster.local
        port:
          number: 20001
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local
        port:
          number: 80 # Use a porta 80 aqui