apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-ingress-nginx
  namespace: argocd
  annotations:
    # Wave 3: Garante que os pools de IP já existam no cluster
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ffagian/microk8s.git'
    targetRevision: HEAD
    path: addons/ingress-nginx
    helm:
      valueFiles: ["values.yaml"]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]