apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  # Isso diz ao Kubernetes: "Estou falando do mesmo Deployment de antes"
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      # As labels do pod precisam bater com o seletor acima
      labels:
        app.kubernetes.io/name: argocd-server
    spec:
      containers:
      - name: argocd-server
        command:
        - argocd-server
        - --insecure      # Garante o acesso via HTTP (porta 8080 interna)
        - --staticassets
        - /shared/app