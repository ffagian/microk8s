apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-app
  namespace: argocd
  # O finalizer garante que, se você deletar o app no Argo, 
  # ele limpe os recursos no cluster (incluindo o namespace demo-apps).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ffagian/microk8s.git
    targetRevision: main # Lembre de conferir se sua branch atual é 'main' ou 'remove-file'
    path: apps/echo-service
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # O Argo cria o namespace demo-apps para você