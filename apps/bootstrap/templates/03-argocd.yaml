apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"

spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 6.7.11

    helm:
      values: |
        global:
          topologySpreadConstraints: &commonConstraints
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: argocd

        server:
          replicas: 2
          topologySpreadConstraints: *commonConstraints

        repoServer:
          replicas: 2
          topologySpreadConstraints: *commonConstraints

        controller:
          replicas: 2
          topologySpreadConstraints: *commonConstraints

        redis-ha:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
