apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ffagian/microk8s.git'
    targetRevision: HEAD
    path: addons/argocd 
    kustomize:
      buildOptions: --enable-helm # Essencial para ler seu values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  
  # --- ADICIONE O BLOCO ABAIXO PARA ESTABILIZAR O BOOTSTRAP ---
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status # Ignora mudanças de status no Sync, focando apenas no código
  # -----------------------------------------------------------

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true