apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: nginx
    # Avisa ao Nginx para falar HTTPS com o pod do ArgoCD
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Permite o redirecionamento correto do tráfego SSL
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  rules:
  - host: argocd-app-of-apps.lab.local  # <--- Deve ser IGUAL à URL da imagem
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 443