apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-metallb-config
  namespace: argocd
  annotations:
    # Wave 2: Só executa após os CRDs do MetalLB (Wave 1) estarem prontos
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ffagian/microk8s.git'
    targetRevision: main
    path: addons/metallb-config # Pasta com IPAddressPool e L2Advertisement
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system # Deve ser o mesmo namespace do controlador MetalLB
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRITICAL: Evita que o ArgoCD falhe ao validar o recurso se o CRD ainda estiver inicializando
      - SkipDryRunOnMissingResource=true
