apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-ingress-nginx
  namespace: argocd
  annotations:
    # Wave 3: Garante que o MetalLB (Wave 1) e suas configs (Wave 2) já existam
    # Isso evita que o Nginx tente subir sem que o MetalLB esteja pronto para dar o IP.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ffagian/microk8s.git'
    targetRevision: HEAD
    path: addons/ingress-nginx
    helm:
      # O ArgoCD usará o arquivo que configuramos com o IP .201 e o SSL Passthrough
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    # Conforme nossa decisão, o Nginx fica em seu próprio namespace
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Cria o namespace ingress-nginx automaticamente se ele não existir
      - CreateNamespace=true