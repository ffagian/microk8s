apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:ffagian/microk8s.git
    targetRevision: main
    path: bootstrap/argocd
    helm:
      chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      version: 7.7.12
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
