# =====================================================
# Argo CD - values.yaml (HA baseado no install.yaml)
# =====================================================

global:
  image:
    tag: latest

# -----------------------------------------------------
# Argo CD Server (UI + API)
# -----------------------------------------------------
server:
  replicas: 2

  service:
    type: ClusterIP
    servicePortHttp: 80
    servicePortHttps: 443

# -----------------------------------------------------
# Repo Server (Git operations)
# -----------------------------------------------------
repoServer:
  replicas: 2

# -----------------------------------------------------
# Application Controller
# (no HA install.yaml ele fica com 1 replica)
# -----------------------------------------------------
controller:
  replicas: 1

# -----------------------------------------------------
# ApplicationSet Controller
# -----------------------------------------------------
applicationSet:
  replicas: 1

# -----------------------------------------------------
# Dex (Auth)
# -----------------------------------------------------
dex:
  enabled: true
  replicas: 1

# -----------------------------------------------------
# Notifications Controller
# -----------------------------------------------------
notifications:
  enabled: true
  replicas: 1

# -----------------------------------------------------
# Redis HA
# -----------------------------------------------------
redis-ha:
  enabled: true

  haproxy:
    enabled: true
    replicas: 3

  redis:
    replicas: 3

# -----------------------------------------------------
# Metrics (mantém default)
# -----------------------------------------------------
metrics:
  enabled: true
